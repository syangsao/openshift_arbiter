name: Pages check
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown link sanity
        run: |
          for f in $(grep -rhoE '\]\(([a-zA-Z0-9_./-]+\.md)\)' README.md 2>/dev/null | sed 's/](\(.*\))/\1/' | sort -u); do
            if [ ! -f "$f" ]; then echo "Missing referenced file: $f"; exit 1; fi
          done
          echo "OK"
